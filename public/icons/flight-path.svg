<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color: #00E5F2;">
  <title>Flight Path Indicator</title>
  <!-- Departure waypoint fix -->
  <polygon points="4,17.5 5.5,19 4,20.5 2.5,19" />

  <!-- Destination waypoint fix -->
  <polygon points="20,3.5 21.5,5 20,6.5 18.5,5" />

  <!-- Flown track (history breadcrumb segment) -->
  <path d="M4 19 C5.5 14, 9 13.5, 12 11" stroke-dasharray="2 1.5" />

  <!-- Active flight plan navigation leg -->
  <path d="M15.5 7.5 C17 6.5, 18.5 5.5, 20 5" />

  <!-- Navigation track distance tick -->
  <line x1="6.5" y1="17.5" x2="8" y2="16" />

  <!-- Small aircraft marker flying along curved route -->
  <polygon points="16.5,6.5 10.5,8 13,10.5 15,13" />
  <line x1="16.5" y1="6.5" x2="12" y2="11" />
</svg>
