<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color: #00E5F2;">
  <title>Altitude Indicator</title>
  <!-- Ground reference datum -->
  <line x1="2" y1="21" x2="22" y2="21" />

  <!-- Vertical altitude scale ladder -->
  <line x1="5" y1="3" x2="5" y2="21" />
  <line x1="5" y1="5" x2="8" y2="5" />
  <line x1="5" y1="9" x2="10" y2="9" />
  <line x1="5" y1="13" x2="8" y2="13" />
  <line x1="5" y1="17" x2="10" y2="17" />

  <!-- Flight level bug pointer -->
  <polygon points="10,9 13,7 13,11" />

  <!-- Aircraft at altitude -->
  <path d="M14.5 7.5v1.5h2" />
  <circle cx="18" cy="9" r="1.25" />
  <line x1="18" y1="7.75" x2="18" y2="5.5" />
  <path d="M19.5 9h2v-1.5" />

  <!-- Vertical measurement dimension -->
  <line x1="18" y1="21" x2="18" y2="12" />
  <path d="M16 14l2-2 2 2" />
</svg>
