<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color: #00E5F2;">
  <title>Roll Bank Angle Indicator</title>
  <!-- Roll scale curved arc across top -->
  <path d="M5 8 A8.5 8.5 0 0 1 19 8" />

  <!-- Zero bank index pointer at top dead center -->
  <polygon points="12,4.5 10.5,2 13.5,2" />

  <!-- Roll scale 30 degree bank calibration ticks -->
  <line x1="6.5" y1="7" x2="5.5" y2="5.5" />
  <line x1="17.5" y1="7" x2="18.5" y2="5.5" />

  <!-- Roll pointer on arc showing bank angle -->
  <polygon points="16.5,6.5 15,5 17.5,4.5" fill="currentColor" />

  <!-- Level horizon datum references -->
  <line x1="3" y1="14" x2="5.5" y2="14" />
  <line x1="18.5" y1="14" x2="21" y2="14" />

  <!-- Banked aircraft reference symbol -->
  <circle cx="12" cy="14" r="1.25" fill="currentColor" />
  <path d="M6 16.5l4.5-2" />
  <path d="M13.5 13.5l4.5-2" />
  <line x1="12" y1="14" x2="10.5" y2="10.5" />

  <!-- Turn coordinator slip/skid inclinometer -->
  <path d="M8 20.5 Q12 22 16 20.5" />
  <circle cx="12" cy="19.5" r="1.25" />
  <line x1="10" y1="19" x2="10" y2="21" />
  <line x1="14" y1="19" x2="14" y2="21" />
</svg>
