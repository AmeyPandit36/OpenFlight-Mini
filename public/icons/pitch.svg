<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color: #00E5F2;">
  <title>Pitch Attitude Indicator</title>
  <!-- Horizon reference line with center opening -->
  <line x1="3" y1="13" x2="8" y2="13" />
  <line x1="16" y1="13" x2="21" y2="13" />

  <!-- +10 degree positive pitch ladder rung with downward tick ends -->
  <path d="M8 8.5v-1.5h8v1.5" />

  <!-- -10 degree negative pitch ladder rung with upward tick ends -->
  <path d="M8.5 17.5v1.5h7v-1.5" />

  <!-- Intermediate pitch graduations -->
  <line x1="10.5" y1="10" x2="13.5" y2="10" />
  <line x1="10.5" y1="16" x2="13.5" y2="16" />

  <!-- Aircraft attitude boresight symbol in nose-up climb -->
  <path d="M4.5 10h4l1.5 1.5" />
  <path d="M19.5 10h-4l-1.5 1.5" />
  <circle cx="12" cy="10" r="1.25" fill="currentColor" />

  <!-- Pitch direction / climb vector -->
  <path d="M10 4.5l2-2.5l2 2.5" />
  <line x1="12" y1="2" x2="12" y2="5" />
</svg>
